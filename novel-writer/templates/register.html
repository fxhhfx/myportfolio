<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 - 小说自动续写</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .register-container {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 40px;
      width: 90%;
      max-width: 380px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    .register-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .register-header h1 {
      font-size: 1.5rem;
      color: #f8fafc;
      margin-bottom: 8px;
    }
    .register-header p {
      color: #94a3b8;
      font-size: 0.85rem;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 0.82rem;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 12px 14px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.3s;
    }
    .form-group input:focus {
      border-color: #6366f1;
    }
    .register-btn {
      width: 100%;
      padding: 12px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
    }
    .register-btn:hover {
      background: #4f46e5;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }
    .register-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .error-msg {
      color: #ef4444;
      font-size: 0.82rem;
      text-align: center;
      margin-top: 12px;
      min-height: 20px;
    }
    .success-msg {
      color: #22c55e;
      font-size: 0.82rem;
      text-align: center;
      margin-top: 12px;
      min-height: 20px;
    }
    .login-link {
      text-align: center;
      margin-top: 20px;
      font-size: 0.85rem;
      color: #94a3b8;
    }
    .login-link a {
      color: #818cf8;
      text-decoration: none;
    }
    .login-link a:hover {
      text-decoration: underline;
    }
    .register-icon {
      font-size: 2.5rem;
      margin-bottom: 12px;
    }
    .password-hint {
      font-size: 0.72rem;
      color: #64748b;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="register-container">
    <div class="register-header">
      <div class="register-icon"></div>
      <h1>创建账户</h1>
      <p>注册后开始你的创作之旅</p>
    </div>
    <form id="registerForm">
      <div class="form-group">
        <label>用户名</label>
        <input type="text" id="username" placeholder="至少 2 个字符" autocomplete="username" required minlength="2">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="password" placeholder="至少 6 个字符" autocomplete="new-password" required minlength="6">
        <div class="password-hint">密码至少 6 个字符</div>
      </div>
      <div class="form-group">
        <label>确认密码</label>
        <input type="password" id="confirmPassword" placeholder="再次输入密码" autocomplete="new-password" required minlength="6">
      </div>
      <button type="submit" class="register-btn" id="registerBtn">注 册</button>
      <div class="error-msg" id="errorMsg"></div>
      <div class="success-msg" id="successMsg"></div>
    </form>
    <div class="login-link">
      已有账户？<a href="/login">去登录</a>
    </div>
  </div>

  <script>
    const form = document.getElementById('registerForm');
    const registerBtn = document.getElementById('registerBtn');
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.textContent = '';
      successMsg.textContent = '';

      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirmPassword').value;

      if (password !== confirm) {
        errorMsg.textContent = '两次密码不一致';
        return;
      }

      registerBtn.disabled = true;
      registerBtn.textContent = '注册中...';

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: password,
            confirm_password: confirm
          })
        });

        const data = await res.json();

        if (res.ok) {
          successMsg.textContent = '注册成功，正在跳转...';
          setTimeout(() => {
            window.location.href = '/';
          }, 800);
        } else {
          errorMsg.textContent = data.error || '注册失败';
        }
      } catch (err) {
        errorMsg.textContent = '网络错误';
      } finally {
        registerBtn.disabled = false;
        registerBtn.textContent = '注 册';
      }
    });
  </script>
</body>
</html>
